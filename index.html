<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plasma Disc</title>
<style>
  :root {
    --panel-bg: rgba(10, 6, 20, 0.72);
    --panel-border: rgba(140, 120, 255, 0.25);
    --accent: #7fffb0;
    --accent-warm: #ff8a4c;
    --text: #d9d4ff;
    --text-dim: #8a82b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #140a26 0%, #05030a 65%, #000 100%);
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#disc {
    display: block;
    touch-action: none;
    cursor: none;
  }
  #reflection {
    position: absolute;
    pointer-events: none;
    opacity: 0.28;
    filter: blur(1px);
    transform-origin: top center;
  }

  /* Control bar */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 10;
  }
  #controls.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(14px);
    pointer-events: none;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(140,120,255,0.3);
    background: rgba(30, 20, 55, 0.6);
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 9px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(60, 45, 100, 0.75); border-color: rgba(160,140,255,0.55); }
  .btn.active {
    background: linear-gradient(135deg, rgba(127,255,176,0.25), rgba(255,138,76,0.2));
    border-color: var(--accent);
    color: #fff;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #fileInput { display: none; }

  .slider-wrap {
    display: flex; flex-direction: column; align-items: center;
    color: var(--text-dim); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 4px;
  }
  .slider-wrap input[type=range] {
    width: 78px;
    accent-color: var(--accent);
  }

  #hint {
    position: fixed;
    top: 22px; left: 50%; transform: translateX(-50%);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 7px 14px;
    border-radius: 999px;
    transition: opacity 0.6s ease;
    z-index: 10;
    backdrop-filter: blur(10px);
  }
  #hint.hidden { opacity: 0; }

  #audioStatus {
    position: fixed;
    top: 22px; right: 22px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.05em;
    z-index: 10;
    text-align: right;
    opacity: 0.85;
    transition: opacity 0.5s ease;
  }
  #audioStatus.hidden { opacity: 0; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="disc"></canvas>
</div>

<div id="hint">touch or move your cursor onto the glass — bolts will reach for you</div>
<div id="audioStatus"></div>

<div id="controls">
  <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
  <div style="width:1px;height:22px;background:rgba(140,120,255,0.25);"></div>
  <button class="btn" id="micBtn">🎙 Microphone</button>
  <button class="btn" id="fileBtn">🎵 Play a song</button>
  <input type="file" id="fileInput" accept="audio/*">
  <button class="btn" id="stopAudioBtn" disabled>⏹ Stop</button>
  <div style="width:1px;height:22px;background:rgba(140,120,255,0.25);"></div>
  <div class="slider-wrap">
    <span>Energy</span>
    <input type="range" id="energySlider" min="0" max="100" value="45">
  </div>
  <div class="slider-wrap">
    <span>Sensitivity</span>
    <input type="range" id="sensSlider" min="1" max="100" value="55">
  </div>
  <div style="width:1px;height:22px;background:rgba(140,120,255,0.25);"></div>
  <button class="btn active" id="sfxBtn">🔊 Plasma Buzz</button>
  <div class="slider-wrap">
    <span>Buzz Vol</span>
    <input type="range" id="sfxVolSlider" min="0" max="100" value="55">
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('disc');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  const hint = document.getElementById('hint');
  const audioStatusEl = document.getElementById('audioStatus');

  // ---------- Quality / low-power ----------
  // Canvas 2D shadowBlur is one of the most expensive operations (Chromium
  // often runs it on the CPU). Combined with a large backing store it made
  // this unusable on a Raspberry Pi 400. Glow is faked with wider additive
  // strokes instead. Weak hardware also drops resolution, bolt count,
  // branches, and caps paint at ~30fps. Detection: start lite on ARM Linux
  // (Pi OS Chromium), or drop to lite if the first couple of seconds of
  // frames are consistently slow. Stay lite once entered — no bouncing.
  const HIGH_Q = {
    dprCap: 2,
    maxCssPx: 0,
    numBolts: 13,
    mainDepth: 5,
    branchDepth: 4,
    maxBranches: 3,
    drawTexture: true,
    paintMinMs: 0,
    haloPass: true
  };
  const LITE_Q = {
    dprCap: 1,
    maxCssPx: 800,
    numBolts: 7,
    mainDepth: 4,
    branchDepth: 3,
    maxBranches: 0,
    drawTexture: false,
    paintMinMs: 33,
    haloPass: false
  };

  function looksLikeLowPower(){
    const ua = navigator.userAgent || '';
    const plat = navigator.platform || '';
    const cores = navigator.hardwareConcurrency || 8;
    if (cores > 0 && cores <= 2) return true;
    if (/Raspberry/i.test(ua)) return true;
    const armLinux = /Linux/i.test(ua) && /aarch64|armv[0-9]|arm64/i.test(ua + ' ' + plat);
    return armLinux && !/Android/i.test(ua);
  }

  // ?lite in the URL forces lite mode (handy on a Pi if UA detection misses).
  let liteMode = looksLikeLowPower() || new URLSearchParams(location.search).has('lite');
  let q = liteMode ? LITE_Q : HIGH_Q;

  // ---------- Sizing: as large as possible within the viewport ----------
  let W = 0, H = 0, R = 0, CX = 0, CY = 0;
  let DPR = Math.min(window.devicePixelRatio || 1, q.dprCap);

  function resize(){
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    let size = Math.floor(Math.min(availW, availH) * 0.94);
    if (q.maxCssPx) size = Math.min(size, q.maxCssPx);
    DPR = Math.min(window.devicePixelRatio || 1, q.dprCap);
    W = size; H = size;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    R = W / 2 * 0.965;
    canvas.dataset.quality = liteMode ? 'lite' : 'high';
    buildGlassTexture();
  }
  window.addEventListener('resize', resize);

  // ---------- Subtle glass hex/dot texture, drawn once to offscreen ----------
  let textureCanvas = document.createElement('canvas');
  function buildGlassTexture(){
    if (!q.drawTexture){
      textureCanvas.width = 1;
      textureCanvas.height = 1;
      return;
    }
    textureCanvas.width = canvas.width;
    textureCanvas.height = canvas.height;
    const tctx = textureCanvas.getContext('2d');
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.clearRect(0,0,W,H);
    tctx.save();
    tctx.beginPath();
    tctx.arc(CX, CY, R, 0, Math.PI*2);
    tctx.clip();
    const spacing = 9;
    tctx.globalAlpha = 0.05;
    for (let y = -R; y < R; y += spacing){
      for (let x = -R; x < R; x += spacing){
        const px = CX + x + (Math.floor((y)/spacing) % 2 ? spacing/2 : 0);
        const py = CY + y;
        const d = Math.hypot(px-CX, py-CY);
        if (d > R) continue;
        tctx.fillStyle = '#bcefff';
        tctx.fillRect(px, py, 1.1, 1.1);
      }
    }
    tctx.restore();
  }

  // ---------- Pointer / touch tracking ----------
  let pointerActive = false;
  let pointerX = 0, pointerY = 0; // relative to center
  let pointerFade = 0; // eased influence 0..1

  function setPointerFromEvent(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left - W/2;
    const y = clientY - rect.top - H/2;
    const d = Math.hypot(x, y);
    if (d > R){
      const s = R / d;
      pointerX = x * s;
      pointerY = y * s;
    } else {
      pointerX = x;
      pointerY = y;
    }
  }
  canvas.addEventListener('pointerdown', (e)=>{
    pointerActive = true;
    setPointerFromEvent(e.clientX, e.clientY);
    showUIBriefly();
    unlockAudioOnce();
    buzzBump = 1; // a firmer swell right at the moment of contact
  });
  canvas.addEventListener('pointermove', (e)=>{
    setPointerFromEvent(e.clientX, e.clientY);
    if (e.pressure > 0 || e.pointerType === 'mouse') {
      pointerActive = pointerActive || e.buttons > 0;
    }
    if (e.pointerType === 'mouse') pointerActive = true; // mouse hover attracts too, like hand near glass
    showUIBriefly();
  });
  canvas.addEventListener('pointerup', ()=>{ pointerActive = false; });
  canvas.addEventListener('pointerleave', ()=>{ pointerActive = false; });
  canvas.addEventListener('pointercancel', ()=>{ pointerActive = false; });

  // ---------- Lightning generation ----------
  // Each main bolt travels from the very center out to the disc edge (or toward pointer),
  // built with recursive midpoint displacement in x/y space, with occasional side branches.

  function rand(a,b){ return a + Math.random()*(b-a); }

  function subdivide(points, roughness, minSeg, depth){
    if (depth <= 0) return points;
    const out = [points[0]];
    for (let i=0; i<points.length-1; i++){
      const p0 = points[i], p1 = points[i+1];
      const mx = (p0.x+p1.x)/2, my = (p0.y+p1.y)/2;
      const dx = p1.x-p0.x, dy = p1.y-p0.y;
      const len = Math.hypot(dx,dy);
      if (len > minSeg){
        const nx = -dy/len, ny = dx/len;
        const disp = rand(-1,1) * roughness * len;
        out.push({x: mx + nx*disp, y: my + ny*disp});
      }
      out.push(p1);
    }
    return subdivide(out, roughness*0.62, minSeg, depth-1);
  }

  class Bolt {
    constructor(mainIndex, totalMain){
      this.mainIndex = mainIndex;
      this.totalMain = totalMain;
      this.regenerate();
      this.life = rand(0,1); // stagger initial flicker phase
    }
    baseAngle(){
      return (this.mainIndex / this.totalMain) * Math.PI*2 + this._angleJitter;
    }
    regenerate(){
      this._angleJitter = rand(-0.35, 0.35);
      const angle = (this.mainIndex / this.totalMain) * Math.PI*2 + this._angleJitter;

      // Target: normally on the circle edge; if pointer is active, bias heavily toward it.
      let tx = Math.cos(angle) * R;
      let ty = Math.sin(angle) * R;

      if (pointerActive && pointerFade > 0.02){
        const pull = 0.55 + 0.4*pointerFade; // how strongly this bolt bends toward the touch point
        tx = tx * (1-pull) + pointerX * pull;
        ty = ty * (1-pull) + pointerY * pull;
      }

      const start = {x:0, y:0};
      const end = {x: tx, y: ty};
      let pts = [start, end];
      pts = subdivide(pts, 0.5, 10, q.mainDepth);
      this.points = pts;

      // Branches: pick a few nodes along the path and grow shorter offshoots outward
      this.branches = [];
      const branchCount = q.maxBranches <= 0 ? 0 : Math.floor(rand(1, q.maxBranches + 1));
      for (let b=0; b<branchCount; b++){
        const idx = Math.floor(rand(pts.length*0.25, pts.length*0.85));
        const from = pts[idx];
        const distFromCenter = Math.hypot(from.x, from.y);
        const outwardAngle = Math.atan2(from.y, from.x) + rand(-0.9,0.9);
        const branchLen = rand(0.15, 0.45) * (R - distFromCenter + 20);
        const bEnd = {
          x: from.x + Math.cos(outwardAngle)*branchLen,
          y: from.y + Math.sin(outwardAngle)*branchLen
        };
        let bpts = subdivide([from, bEnd], 0.55, 8, q.branchDepth);
        this.branches.push(bpts);
      }
    }
    colorAt(dist){
      const t = Math.min(dist / R, 1);
      // three concentric zones: green core -> orange/red -> blue edge
      if (t < 0.28){
        const k = t/0.28;
        return lerpColor([210,255,225], [90,255,140], k); // white-green core to green
      } else if (t < 0.62){
        const k = (t-0.28)/0.34;
        return lerpColor([90,255,140], [255,120,40], k); // green to red/orange
      } else {
        const k = (t-0.62)/0.38;
        return lerpColor([255,120,40], [120,200,255], k); // orange to blue-white
      }
    }
  }

  function lerpColor(c0,c1,k){
    k = Math.max(0, Math.min(1,k));
    return [
      Math.round(c0[0]+(c1[0]-c0[0])*k),
      Math.round(c0[1]+(c1[1]-c0[1])*k),
      Math.round(c0[2]+(c1[2]-c0[2])*k)
    ];
  }

  let bolts = [];
  function initBolts(){
    bolts = [];
    for (let i=0;i<q.numBolts;i++){
      bolts.push(new Bolt(i, q.numBolts));
    }
  }
  initBolts();

  // ---------- Audio reactivity ----------
  let audioCtx = null;
  let analyser = null;
  let audioData = null;
  let audioSource = null; // either media element source or mic stream source
  let currentAudioEl = null;
  let audioMode = 'none'; // 'none' | 'mic' | 'file'
  let bassEnergy = 0; // smoothed 0..1
  let sensitivity = 0.55;
  let manualEnergy = 0.45;

  function ensureAudioCtx(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.75;
      audioData = new Uint8Array(analyser.frequencyBinCount);

      // Separate bus for the synthesized plasma buzz. This is deliberately
      // NOT routed through `analyser` — the analyser only ever looks at the
      // external music source (mic or file), so the buzz can never feed back
      // into and distort the music-reactive visuals.
      sfxMasterGain = audioCtx.createGain();
      sfxMasterGain.gain.value = sfxEnabled ? sfxVolume : 0;
      sfxMasterGain.connect(audioCtx.destination);

      noiseBuffer = buildNoiseBuffer(audioCtx);

      // Continuous ambient "plasma buzz" engine — two detuned low oscillators
      // beating against each other (like a transformer/mains hum), running
      // permanently at a soft idle level. Bolt activity and touch make it
      // swell smoothly rather than firing discrete clicks, which is what
      // reads as mechanical. A faint filtered-noise layer adds just a hint
      // of "air" underneath the tone.
      initBuzzEngine();
    }
  }

  function initBuzzEngine(){
    buzzGain = audioCtx.createGain();
    buzzGain.gain.value = 0.0001;
    buzzGain.connect(sfxMasterGain);

    buzzFilter = audioCtx.createBiquadFilter();
    buzzFilter.type = 'lowpass';
    buzzFilter.frequency.value = 420;
    buzzFilter.Q.value = 0.6;
    buzzFilter.connect(buzzGain);

    buzzOscA = audioCtx.createOscillator();
    buzzOscA.type = 'sawtooth';
    buzzOscA.frequency.value = 56;
    const oscAGain = audioCtx.createGain();
    oscAGain.gain.value = 0.5;
    buzzOscA.connect(oscAGain); oscAGain.connect(buzzFilter);
    buzzOscA.start();

    buzzOscB = audioCtx.createOscillator();
    buzzOscB.type = 'sawtooth';
    buzzOscB.frequency.value = 56.7; // slight detune -> slow beating, organic buzz
    const oscBGain = audioCtx.createGain();
    oscBGain.gain.value = 0.42;
    buzzOscB.connect(oscBGain); oscBGain.connect(buzzFilter);
    buzzOscB.start();

    // very slow, subtle drift on the filter cutoff — background "breathing"
    // texture only. Kept shallow so it doesn't mask or fight the sharper,
    // clearly-timed swell driven by the pulse clock in the render loop.
    buzzLFO = audioCtx.createOscillator();
    buzzLFO.type = 'sine';
    buzzLFO.frequency.value = 0.09;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 25;
    buzzLFO.connect(lfoGain);
    lfoGain.connect(buzzFilter.frequency);
    buzzLFO.start();

    // faint airy noise texture, well underneath the tone
    buzzNoiseSrc = audioCtx.createBufferSource();
    buzzNoiseSrc.buffer = noiseBuffer;
    buzzNoiseSrc.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1100;
    noiseFilter.Q.value = 0.5;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.045;
    buzzNoiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(buzzGain);
    buzzNoiseSrc.start();
  }

  // ---------- Synthesized plasma buzz ----------
  let sfxMasterGain = null;
  let noiseBuffer = null;
  let sfxEnabled = true;
  let sfxVolume = 0.55;
  let buzzGain = null, buzzFilter = null, buzzOscA = null, buzzOscB = null, buzzLFO = null, buzzNoiseSrc = null;
  let buzzBump = 0; // short-lived swell added by bolt activity, decays each frame

  function buildNoiseBuffer(ctxA){
    const len = ctxA.sampleRate * 1;
    const buf = ctxA.createBuffer(1, len, ctxA.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
    return buf;
  }

  // Called every frame: smoothly sets the buzz's overall level and filter
  // brightness from idle hum + music energy + touch proximity + bolt bumps.
  // Using setTargetAtTime (an exponential glide) instead of stepped values
  // is what keeps this sounding like a tone that breathes, not a switch.
  function updateBuzz(){
    if (!buzzGain || !audioCtx) return;
    buzzBump *= 0.92;
    const t = audioCtx.currentTime;
    const level = Math.min(1.3, 0.16 + bassEnergy*0.55 + pointerFade*0.55 + buzzBump*0.6);
    buzzGain.gain.setTargetAtTime(sfxEnabled ? level : 0, t, 0.15);
    const cutoff = 380 + bassEnergy*520 + pointerFade*420 + buzzBump*260;
    buzzFilter.frequency.setTargetAtTime(cutoff, t, 0.18);
    if (buzzOscB) buzzOscB.frequency.setTargetAtTime(56.7 + bassEnergy*1.3 + pointerFade*0.7, t, 0.2);
  }

  // Bolt regenerations nudge the buzz's swell up a small notch (organic
  // texture between beats). The dominant, clearly-audible swell comes from
  // the shared pulse clock below, not from individual bolts — that's what
  // keeps this feeling synchronized rather than clicky.
  function maybeTriggerZapForBolt(bolt){
    if (!sfxEnabled || !audioCtx) return;
    if (Math.random() > 0.5) return;
    buzzBump = Math.min(1, buzzBump + 0.035 + bassEnergy*0.05);
  }

  function unlockAudioOnce(){
    ensureAudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
  document.addEventListener('keydown', unlockAudioOnce, {once:true});

  function teardownAudioSource(){
    if (audioSource){
      try { audioSource.disconnect(); } catch(e){}
      audioSource = null;
    }
    if (currentAudioEl){
      try { currentAudioEl.pause(); } catch(e){}
      currentAudioEl.src = '';
      currentAudioEl = null;
    }
    audioMode = 'none';
    micBtn.classList.remove('active');
    fileBtn.classList.remove('active');
    stopAudioBtn.disabled = true;
    audioStatusEl.textContent = '';
    audioStatusEl.classList.add('hidden');
  }

  async function startMic(){
    ensureAudioCtx();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    teardownAudioSource();
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioSource = audioCtx.createMediaStreamSource(stream);
      audioSource.connect(analyser);
      audioMode = 'mic';
      micBtn.classList.add('active');
      stopAudioBtn.disabled = false;
      audioStatusEl.textContent = 'listening: microphone';
      audioStatusEl.classList.remove('hidden');
    }catch(err){
      audioStatusEl.textContent = 'microphone access denied';
      audioStatusEl.classList.remove('hidden');
    }
  }

  function startFile(file){
    ensureAudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    teardownAudioSource();
    const url = URL.createObjectURL(file);
    const el = new Audio();
    el.src = url;
    el.loop = true;
    el.crossOrigin = 'anonymous';
    currentAudioEl = el;
    audioSource = audioCtx.createMediaElementSource(el);
    audioSource.connect(analyser);
    analyser.connect(audioCtx.destination);
    el.play();
    audioMode = 'file';
    fileBtn.classList.add('active');
    stopAudioBtn.disabled = false;
    audioStatusEl.textContent = 'playing: ' + (file.name || 'audio file');
    audioStatusEl.classList.remove('hidden');
  }

  function readAudioEnergy(){
    if (audioMode === 'none' || !analyser){
      // fall back to the manual "Energy" slider so the disc always has some life
      const target = manualEnergy * 0.5;
      bassEnergy += (target - bassEnergy) * 0.05;
      return;
    }
    analyser.getByteFrequencyData(audioData);
    // focus on the lower ~1/4 of bins (bass/mid) for the "pulse"
    const n = Math.floor(audioData.length * 0.28);
    let sum = 0;
    for (let i=0;i<n;i++) sum += audioData[i];
    const avg = (sum / n) / 255; // 0..1
    const target = Math.min(1, avg * (0.6 + sensitivity*1.8));
    bassEnergy += (target - bassEnergy) * 0.25;
  }

  // ---------- UI wiring ----------
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const micBtn = document.getElementById('micBtn');
  const fileBtn = document.getElementById('fileBtn');
  const fileInput = document.getElementById('fileInput');
  const stopAudioBtn = document.getElementById('stopAudioBtn');
  const energySlider = document.getElementById('energySlider');
  const sensSlider = document.getElementById('sensSlider');

  fullscreenBtn.addEventListener('click', ()=>{
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });
  micBtn.addEventListener('click', ()=>{
    if (audioMode === 'mic'){ teardownAudioSource(); } else { startMic(); }
  });
  fileBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files && e.target.files[0];
    if (f) startFile(f);
  });
  stopAudioBtn.addEventListener('click', teardownAudioSource);
  energySlider.addEventListener('input', (e)=>{ manualEnergy = e.target.value/100; });
  sensSlider.addEventListener('input', (e)=>{ sensitivity = e.target.value/100; });

  const sfxBtn = document.getElementById('sfxBtn');
  const sfxVolSlider = document.getElementById('sfxVolSlider');
  sfxBtn.addEventListener('click', ()=>{
    sfxEnabled = !sfxEnabled;
    sfxBtn.classList.toggle('active', sfxEnabled);
    if (sfxMasterGain) sfxMasterGain.gain.value = sfxEnabled ? sfxVolume : 0;
  });
  sfxVolSlider.addEventListener('input', (e)=>{
    sfxVolume = e.target.value/100;
    if (sfxMasterGain && sfxEnabled) sfxMasterGain.gain.value = sfxVolume;
  });

  // Auto-hide the control bar / hint after inactivity, for clean TV casting
  let uiTimer = null;
  function showUIBriefly(){
    controls.classList.remove('hidden');
    hint.classList.remove('hidden');
    if (uiTimer) clearTimeout(uiTimer);
    uiTimer = setTimeout(()=>{
      controls.classList.add('hidden');
      hint.classList.add('hidden');
    }, 4500);
  }
  window.addEventListener('pointermove', showUIBriefly);
  window.addEventListener('pointerdown', showUIBriefly);
  showUIBriefly();

  // ---------- Draw loop ----------
  let lastTime = performance.now();
  let lastPaint = 0;
  let flickerTimers = new Array(q.numBolts).fill(0);
  let pulseTimer = 0; // shared "beat" clock: fires a cluster of bolts + a buzz swell together
  let perfWarmupUntil = 0;
  let perfFrames = 0;
  let perfLong = 0;
  let perfDone = liteMode;

  function enterLiteMode(){
    if (liteMode) return;
    liteMode = true;
    q = LITE_Q;
    perfDone = true;
    initBolts();
    flickerTimers = new Array(q.numBolts).fill(0);
    resize();
  }

  function notePerf(now, dt){
    if (liteMode || perfDone) return;
    if (document.hidden){
      perfWarmupUntil = 0;
      perfFrames = 0;
      perfLong = 0;
      return;
    }
    if (!perfWarmupUntil) perfWarmupUntil = now + 900;
    if (now < perfWarmupUntil) return;
    perfFrames++;
    if (dt > 32) perfLong++;
    if (perfFrames >= 40){
      perfDone = true;
      if (perfLong / perfFrames >= 0.3) enterLiteMode();
    }
  }

  function drawBoltPath(points, colorFn, widthScale, alphaScale){
    if (!points || points.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowBlur = 0;

    const path = new Path2D();
    path.moveTo(points[0].x + CX, points[0].y + CY);
    for (let i=1;i<points.length;i++){
      path.lineTo(points[i].x + CX, points[i].y + CY);
    }
    const mid = points[Math.floor(points.length/2)];
    const midDist = Math.hypot(mid.x, mid.y);
    const [r,g,b] = colorFn(midDist);

    // Wide additive halo stands in for the old per-stroke shadowBlur.
    if (q.haloPass){
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.09*alphaScale})`;
      ctx.lineWidth = (16 + 10*bassEnergy) * widthScale;
      ctx.stroke(path);
    }
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.22*alphaScale})`;
    ctx.lineWidth = (7 + 5*bassEnergy) * widthScale;
    ctx.stroke(path);
    ctx.strokeStyle = `rgba(${Math.min(255,r+15)},${Math.min(255,g+15)},${Math.min(255,b+15)},${0.92*alphaScale})`;
    ctx.lineWidth = (1.4 + 1.1*bassEnergy) * widthScale;
    ctx.stroke(path);
    ctx.restore();
  }

  function frame(now){
    const dt = Math.min(64, now - lastTime);
    lastTime = now;
    notePerf(now, dt);

    // pointer influence eases in/out
    pointerFade += ((pointerActive?1:0) - pointerFade) * 0.12;

    // ---- Shared pulse clock ----
    // Rather than trying to sync sound to every independently timed bolt
    // (which is what made the old per-bolt zaps feel clicky), a periodic
    // "beat" forces a cluster of bolts to flash together and swells the
    // buzz at that exact instant. Individual bolts still flicker on their
    // own in between beats for organic texture, but the ear/eye both land
    // on the same clearly-timed event, which reads as "in sync."
    // Kept to a modest fraction of bolts and a moderate tempo (well under
    // ~3 flashes/sec at idle) so it stays a pleasant pulse, not a strobe.
    pulseTimer -= dt;
    if (pulseTimer <= 0){
      const pulseInterval = Math.max(210, 380 - bassEnergy*160 - pointerFade*70);
      pulseTimer = pulseInterval + rand(-25, 25);
      const fireFraction = 0.3 + bassEnergy*0.25 + pointerFade*0.15;
      for (let i=0;i<bolts.length;i++){
        if (Math.random() < fireFraction){
          bolts[i].regenerate();
          flickerTimers[i] = 90 + Math.random()*140;
        }
      }
      buzzBump = Math.min(1, buzzBump + 0.55 + bassEnergy*0.3);
    }

    readAudioEnergy();
    updateBuzz();

    // Bolt lifetimes always tick, even when lite mode skips a paint.
    for (let i=0;i<bolts.length;i++){
      flickerTimers[i] -= dt;
      const regenInterval = 90 + Math.random()*140 - bassEnergy*70;
      if (flickerTimers[i] <= 0){
        bolts[i].regenerate();
        flickerTimers[i] = regenInterval;
        maybeTriggerZapForBolt(bolts[i]);
      }
    }

    if (q.paintMinMs && (now - lastPaint) < q.paintMinMs){
      requestAnimationFrame(frame);
      return;
    }
    lastPaint = now;

    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI*2);
    ctx.clip();

    // Background inner ambience
    const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    const glow = 0.5 + bassEnergy*0.5;
    bg.addColorStop(0, `rgba(40,60,50,${0.5*glow})`);
    bg.addColorStop(0.35, `rgba(30,15,25,${0.35*glow})`);
    bg.addColorStop(1, `rgba(5,5,15,0.9)`);
    ctx.fillStyle = bg;
    ctx.fillRect(CX-R, CY-R, R*2, R*2);

    // Bolts
    for (let i=0;i<bolts.length;i++){
      const bolt = bolts[i];
      const alpha = 0.55 + Math.random()*0.45;
      drawBoltPath(bolt.points, (d)=>bolt.colorAt(d), 1, alpha);
      for (const bpts of bolt.branches){
        drawBoltPath(bpts, (d)=>bolt.colorAt(d), 0.6, alpha*0.8);
      }
    }

    // White-hot center core
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const coreR = R * (0.08 + bassEnergy*0.05);
    const coreGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR*3.2);
    coreGrad.addColorStop(0, `rgba(255,255,255,${0.85})`);
    coreGrad.addColorStop(0.25, `rgba(190,255,210,0.55)`);
    coreGrad.addColorStop(1, `rgba(120,255,160,0)`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR*3.2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // pointer touch glow
    if (pointerFade > 0.01){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const px = CX + pointerX, py = CY + pointerY;
      const g = ctx.createRadialGradient(px,py,0,px,py, 30);
      g.addColorStop(0, `rgba(255,255,255,${0.55*pointerFade})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px,py,30,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // glass texture overlay
    if (q.drawTexture){
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(textureCanvas, 0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';

    // subtle vignette / glass edge highlight
    const edge = ctx.createRadialGradient(CX,CY,R*0.7,CX,CY,R);
    edge.addColorStop(0, 'rgba(0,0,0,0)');
    edge.addColorStop(0.85, 'rgba(80,110,180,0.08)');
    edge.addColorStop(1, 'rgba(140,170,255,0.35)');
    ctx.fillStyle = edge;
    ctx.fillRect(CX-R, CY-R, R*2, R*2);

    // ---- Three concentric color rings ----
    // A translucent tint layered on top of the plasma itself: green center
    // third, red/orange middle third, blue outer third. Soft feathered edges
    // between bands (rather than hard cutoffs) keep it looking like a glow
    // zone rather than a printed target.
    // Deliberately drawn LAST, after the glass texture and edge vignette —
    // both of those add brightness back into the outer zone (the texture via
    // additive 'lighter', the vignette as a pale highlight), which was
    // cancelling out the blue band's tint when the ring overlay ran earlier
    // in the pipeline. Being last means multiply gets the final word.
    // Uses 'multiply' blending rather than a plain alpha blend: the bolts'
    // brightest highlights are near-white from their additive glow, and a
    // normal blend (or even the 'color' blend mode, which preserves the
    // destination's luminosity) washes back out to white at that brightness.
    // Multiply scales each color channel toward the overlay's own channel
    // values, so even a pure-white highlight gets pulled to the overlay's
    // hue — like a colored gel held in front of a bright light.
    const ringGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    const ringAlpha = 0.55 + bassEnergy*0.08;
    const b1 = 1/3, b2 = 2/3, feather = 0.09; // wider feather = softer band edges
    ringGrad.addColorStop(0.00, `rgba(60,255,90,${ringAlpha})`);
    ringGrad.addColorStop(Math.max(0, b1-feather), `rgba(60,255,90,${ringAlpha})`);
    ringGrad.addColorStop(Math.min(1, b1+feather), `rgba(255,70,20,${ringAlpha})`);
    ringGrad.addColorStop(Math.max(0, b2-feather), `rgba(255,70,20,${ringAlpha})`);
    ringGrad.addColorStop(Math.min(1, b2+feather), `rgba(15,70,255,${ringAlpha})`);
    ringGrad.addColorStop(1.00, `rgba(15,70,255,${ringAlpha})`);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = ringGrad;
    ctx.fillRect(CX-R, CY-R, R*2, R*2);
    ctx.restore();

    ctx.restore(); // end clip

    // outer glass rim
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI*2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(160,190,255,0.35)';
    ctx.stroke();

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
